<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#F2F5FA">
    <title>Roadmap — IsipNayan</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/nav-drawer.css">
    <link rel="stylesheet" href="css/app-shell.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--font-body); }
        main { max-width: 900px; margin: 0 auto; padding: 1.2rem 1.5rem 3rem; }
        .page-head { display: flex; align-items: center; gap: 0.9rem; margin-bottom: 1rem; }
        .back { color: var(--text); font-size: 1.8rem; line-height: 1; text-decoration: none; }
        h1 { margin: 0; font-size: 1.7rem; font-weight: 900; color: var(--heading); }
        h2 { margin: 0 0 0.6rem; font-size: 1.15rem; color: var(--heading); }
        h3 { margin: 1rem 0 0.4rem; font-size: 0.95rem; color: var(--heading); }
        .card { background: var(--bg-elevated); border: 1px solid var(--field-border); border-radius: 12px; padding: 1.2rem 1.4rem; margin-bottom: 1.2rem; box-shadow: 1px 2px 8px rgba(0,0,0,0.08); }
        .muted { color: var(--text-muted); font-size: 0.85rem; margin: 0; }
        ul.plain, ol.plain { margin: 0; padding: 0; list-style: none; }
        .reminder { padding: 0.55rem 0; border-bottom: 1px solid var(--border); }
        .reminder:last-child { border-bottom: 0; }
        .reminder .meta { color: var(--text-muted); font-size: 0.8rem; }
        .reminder.overdue .meta { color: var(--danger); }
        .bar { height: 8px; border-radius: 999px; background: var(--border); overflow: hidden; margin: 0.5rem 0 0.2rem; }
        .bar > span { display: block; height: 100%; background: var(--accent); }
        .lesson { display: flex; align-items: center; gap: 0.7rem; padding: 0.6rem 0; border-bottom: 1px solid var(--border); }
        .lesson:last-child { border-bottom: 0; }
        .lesson .num { width: 1.8rem; height: 1.8rem; border-radius: 50%; display: grid; place-items: center; font-size: 0.8rem; font-weight: 700; border: 2px solid var(--field-border); flex: none; }
        .lesson.done .num { background: var(--accent); border-color: var(--accent); color: #fff; }
        .lesson.next .num { border-color: var(--accent); color: var(--accent); }
        .lesson a { color: var(--text); text-decoration: none; font-weight: 500; flex: 1; overflow-wrap: anywhere; }
        .lesson.upcoming a { color: var(--text-muted); }
        .lesson a:hover { text-decoration: underline; }
        .chip { font-size: 0.75rem; padding: 0.15rem 0.55rem; border-radius: 999px; border: 1px solid var(--field-border); color: var(--text-muted); white-space: nowrap; }
        .chip.next { background: var(--accent); border-color: var(--accent); color: #fff; }
        .chip.level-struggling { color: #c0392b; border-color: #c0392b; }
        .chip.level-developing { color: #b9770e; border-color: #b9770e; }
        .chip.level-proficient { color: var(--text-muted); }
        .chip.level-mastered { color: #1e8449; border-color: #1e8449; font-weight: 700; }
        .practice-link { font-size: 0.78rem; margin-left: 0.4rem; white-space: nowrap; }
        .plan-lesson { margin: 0 0 0.8rem; }
        .plan-lesson ul { margin: 0.3rem 0 0; padding-left: 1.3rem; line-height: 1.7; }
        .error { color: var(--danger); }
    </style>
    <link rel="stylesheet" href="css/pages.css?v=1">
    <link rel="stylesheet" href="css/mobile.css?v=1">
</head>
<body>
    <header class="app-header">
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
        <a class="brand-lockup" href="landing.html"><span class="brand-mark" aria-hidden="true"></span>IsipNayan</a>
    </header>

    <main>
        <div class="page-head">
            <a class="back" href="landing.html" aria-label="Back to dashboard">&larr;</a>
            <h1>Your learning roadmap</h1>
        </div>

        <section class="card" id="reminders" hidden>
            <h2>Reminders</h2>
            <ul class="plain" id="reminderList"></ul>
        </section>

        <p class="muted" id="status" role="status">Loading your roadmap…</p>
        <div id="roadmap"></div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/roadmap.js"></script>
    <script>requireAuth(); initNavDrawer();</script>
</body>
<footer class="bottom-footer">All Rights Reserved <span class="sep">|</span> @2026</footer>
</html>
