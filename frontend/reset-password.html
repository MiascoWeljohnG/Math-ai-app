<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password · IsipNayan</title>
<link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/auth.css"><link rel="stylesheet" href="css/pages.css"><link rel="stylesheet" href="css/mobile.css">
</head>
<body class="auth-page"><main class="auth-card" style="max-width:480px;margin:8vh auto;padding:2rem">
<h1>Choose a new password</h1><p>Reset links expire after 30 minutes and work once.</p>
<form id="resetForm"><label for="newPassword">New password</label><input class="plain-field" id="newPassword" type="password" required minlength="8" autocomplete="new-password"><p id="message" class="form-msg" role="alert"></p><button class="btn-primary" type="submit">Update password</button></form>
<a id="loginLink" href="login.html" hidden>Return to sign in</a>
</main><script src="js/auth.js?v=3"></script></body></html>
