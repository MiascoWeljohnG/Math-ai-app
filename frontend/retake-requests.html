<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#F2F5FA">
    <link rel="icon" href="data:,">
    <title>Quiz retake requests · Teacher Dashboard</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/nav-drawer.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/overview.css">
    <link rel="stylesheet" href="css/pages.css?v=1">
    <link rel="stylesheet" href="css/mobile.css?v=1">
    <link rel="stylesheet" href="css/admin-profile.css?v=1">
</head>
<body>
<div class="page">
    <div class="header" id="staffHeader" data-title="Teacher Dashboard"></div>
    <script src="js/staff-header.js"></script>

    <div class="section" id="retakeSection">
        <div class="section-head">
            <h2>Quiz retake requests <span class="tag warn" id="retakeCount" hidden>0</span></h2>
            <p class="hint">A student whose quiz is ended for leaving the page too often is locked out of that quiz until you approve their feedback. Approving gives them one more try.</p>
        </div>
        <div class="table-wrap file-list" id="retakeWrap" hidden>
            <table>
                <thead><tr><th>Student</th><th>Quiz</th><th>Reason</th><th>Their feedback</th><th>Status</th><th></th></tr></thead>
                <tbody id="retakeRows"></tbody>
            </table>
        </div>
        <p class="empty" id="noRetakes" style="display:none;">No student has used up their practice tries yet.</p>
        <div class="status" id="retakeStatus" role="status" aria-live="polite"></div>
    </div>
</div>

    <script src="js/modal.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/material-table.js"></script>
    <script src="js/teacher-common.js"></script>
    <script src="js/retake-requests.js"></script>
    <script src="js/teacher-bell.js"></script>
    <script>
        requireRole("teacher");
        initNavDrawer({ staff: true, pages: STAFF_PAGES.teacher });
    </script>
</body>
</html>
