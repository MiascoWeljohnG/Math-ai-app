<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 2rem; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .header h1 { font-size: 1.3rem; }
        .btn { padding: 0.5rem 1rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-secondary { background: none; border: 1px solid var(--border); color: var(--text); }
        .section { background: var(--bg-elevated); border-radius: 10px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .section h2 { font-size: 1rem; color: var(--text-muted); margin-bottom: 1rem; }
        .drop-zone { border: 2px dashed var(--border); border-radius: 8px; padding: 1.25rem; min-height: 5rem; text-align: center; color: var(--text-muted); cursor: pointer; transition: border-color 0.2s; display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
        .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); color: var(--accent); }
        .drop-zone .placeholder { margin: auto; font-size: 0.9rem; pointer-events: none; }
        .file-chip { display: flex; align-items: center; gap: 0.5rem; background: var(--bg-input); border: 1px solid var(--border); border-radius: 999px; padding: 0.35rem 0.4rem 0.35rem 0.75rem; font-size: 0.8rem; color: var(--text); max-width: 260px; }
        .file-chip.duplicate { border-color: #f59e0b; background: rgba(245,158,11,0.08); }
        .file-chip .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-chip .fremove { background: var(--border); border: none; color: var(--text); width: 18px; height: 18px; border-radius: 50%; cursor: pointer; font-size: 0.7rem; line-height: 1; flex-shrink: 0; }
        .file-chip .fremove:hover { background: var(--danger); }
        .dup-warning { margin-top: 0.6rem; font-size: 0.82rem; color: #f59e0b; display: none; }
        .dup-warning.show { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
        th, td { text-align: left; padding: 0.6rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        th { color: var(--text-muted); }
        .status { margin-top: 1rem; padding: 0.75rem; border-radius: 6px; display: none; }
        .status.success { display: block; background: #064e3b; color: #6ee7b7; }
        .status.error { display: block; background: #7f1d1d; color: #fca5a5; }
        .teacher-form input { flex:1; min-width:140px; padding:0.6rem; border-radius:6px; border:1px solid var(--border); background:var(--bg-input); color:var(--text); }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--bg-elevated); border-radius: 12px; padding: 2rem; width: 420px; max-width: 90vw; position: relative; }
        .modal h2 { color: var(--text); margin-bottom: 1.25rem; font-size: 1.2rem; }
        .modal .close-btn { position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; line-height: 1; }
        .modal .close-btn:hover { color: var(--text); }
        .modal label { display: block; color: var(--text-muted); font-size: 0.85rem; margin-top: 0.9rem; }
        .modal input { width: 100%; padding: 0.65rem; margin-top: 0.3rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-input); color: var(--text); font-size: 0.95rem; box-sizing: border-box; }
        .modal button[type="submit"] { width: 100%; padding: 0.7rem; margin-top: 1.5rem; border: none; border-radius: 6px; background: var(--accent); color: white; font-size: 0.95rem; cursor: pointer; }
        .modal button[type="submit"]:hover { background: var(--accent-hover); }
        .branch-select { padding: 0.5rem 0.7rem; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text); font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Admin Dashboard</h1>
        <div style="display:flex; align-items:center; gap:0.75rem;">
            <button class="btn btn-secondary" id="openTeacherModalBtn">+ Add Teacher</button>
            <span id="themeSwitchWrap"></span>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="section">
        <h2>Upload Knowledge Base</h2>
        <div class="drop-zone" id="dropZone">
            <p class="placeholder" id="dropPlaceholder">Drag & drop text, PDF, or Word files here, or click to browse</p>
        </div>
        <input type="file" id="fileInput" multiple accept=".txt,.pdf,.docx" style="display:none">
        <div class="dup-warning" id="dupWarning"></div>
                <div style="display:flex; align-items:center; gap:0.6rem; margin-top:1rem;">
            <label for="branchSelect" style="color:var(--text-muted); font-size:0.85rem;">Math branch</label>
            <select id="branchSelect" class="branch-select">
                <option value="Algebra">Algebra</option>
                <option value="Geometry">Geometry</option>
                <option value="Statistics">Statistics</option>
                <option value="Calculus">Calculus</option>
                <option value="General">General (no specific branch)</option>
            </select>
        </div>
        <button class="btn btn-primary" style="margin-top:1rem" id="uploadBtn" onclick="uploadFiles()" disabled>Upload & Ingest</button>
        <div class="status" id="uploadStatus"></div>
    </div>

    <div class="section">
        <h2>Files in Knowledge Base</h2>
        <table id="filesTable">
            <thead><tr><th>File Name</th></tr></thead>
            <tbody></tbody>
        </table>
        <p id="noFiles" style="color:var(--text-muted); font-size:0.85rem; margin-top:0.5rem">No files uploaded yet.</p>
    </div>

    <div class="section">
        <h2>Registered Users</h2>
        <table id="usersTable">
            <thead><tr><th>Username</th><th>First Name</th><th>Last Name</th><th>Email</th><th>Birthday</th><th>Role</th><th>Joined</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="section">
        <h2>⚠️ Danger Zone</h2>
        <button class="btn btn-danger" onclick="clearKB()">Clear Entire Knowledge Base</button>
    </div>

    <div class="modal-overlay" id="teacherModal">
        <div class="modal">
            <button class="close-btn" id="closeTeacherModal">&times;</button>
            <h2>Add Teacher Account</h2>
            <form id="teacherForm">
                <label>Username</label>
                <input type="text" id="teacherUsername" required>

                <label>First name</label>
                <input type="text" id="teacherFirstName" required>

                <label>Last name</label>
                <input type="text" id="teacherLastName" required>

                <label>Email</label>
                <input type="email" id="teacherEmail" required>

                <label>Temporary password</label>
                <input type="password" id="teacherPassword" required minlength="6">

                <div class="status" id="teacherStatus"></div>
                <button type="submit">Create Teacher Account</button>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
    <script>
        requireRole("admin");
        document.getElementById("themeSwitchWrap").innerHTML = themeSwitchHTML("adminThemeSwitch");
        wireThemeSwitch("adminThemeSwitch");

        const teacherModal = document.getElementById("teacherModal");
        document.getElementById("openTeacherModalBtn").addEventListener("click", () => {
            teacherModal.classList.add("active");
        });
        document.getElementById("closeTeacherModal").addEventListener("click", () => {
            teacherModal.classList.remove("active");
        });
        teacherModal.addEventListener("click", (e) => {
            if (e.target === teacherModal) teacherModal.classList.remove("active");
        });
        document.getElementById("teacherForm").addEventListener("submit", (e) => {
            e.preventDefault();
            createTeacher();
        });
    </script>
</body>
</html>
