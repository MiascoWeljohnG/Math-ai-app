<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .header h1 { font-size: 1.3rem; }
        .btn { padding: 0.5rem 1rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-primary { background: #3b82f6; color: white; }
        .section { background: #1e293b; border-radius: 10px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .section h2 { font-size: 1rem; color: #94a3b8; margin-bottom: 1rem; }
        .drop-zone { border: 2px dashed #334155; border-radius: 8px; padding: 1.25rem; min-height: 5rem; text-align: center; color: #64748b; cursor: pointer; transition: border-color 0.2s; display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
        .drop-zone:hover, .drop-zone.dragover { border-color: #3b82f6; color: #3b82f6; }
        .drop-zone .placeholder { margin: auto; font-size: 0.9rem; pointer-events: none; }
        .file-chip { display: flex; align-items: center; gap: 0.5rem; background: #0f1c31; border: 1px solid #334155; border-radius: 999px; padding: 0.35rem 0.4rem 0.35rem 0.75rem; font-size: 0.8rem; color: #e2e8f0; max-width: 260px; }
        .file-chip.duplicate { border-color: #f59e0b; background: rgba(245,158,11,0.08); }
        .file-chip .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-chip .fremove { background: #334155; border: none; color: #e2e8f0; width: 18px; height: 18px; border-radius: 50%; cursor: pointer; font-size: 0.7rem; line-height: 1; flex-shrink: 0; }
        .file-chip .fremove:hover { background: #ef4444; }
        .dup-warning { margin-top: 0.6rem; font-size: 0.82rem; color: #f59e0b; display: none; }
        .dup-warning.show { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
        th, td { text-align: left; padding: 0.6rem; border-bottom: 1px solid #334155; font-size: 0.9rem; }
        th { color: #64748b; }
        .status { margin-top: 1rem; padding: 0.75rem; border-radius: 6px; display: none; }
        .status.success { display: block; background: #064e3b; color: #6ee7b7; }
        .status.error { display: block; background: #7f1d1d; color: #fca5a5; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Admin Dashboard</h1>
        <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>

    <div class="section">
        <h2>Upload Knowledge Base</h2>
        <div class="drop-zone" id="dropZone">
            <p class="placeholder" id="dropPlaceholder">Drag & drop text, PDF, or Word files here, or click to browse</p>
        </div>
        <input type="file" id="fileInput" multiple accept=".txt,.pdf,.docx" style="display:none">
        <div class="dup-warning" id="dupWarning"></div>
        <button class="btn btn-primary" style="margin-top:1rem" id="uploadBtn" onclick="uploadFiles()" disabled>Upload & Ingest</button>
        <div class="status" id="uploadStatus"></div>
    </div>

    <div class="section">
        <h2>Files in Knowledge Base</h2>
        <table id="filesTable">
            <thead><tr><th>File Name</th></tr></thead>
            <tbody></tbody>
        </table>
        <p id="noFiles" style="color:#64748b; font-size:0.85rem; margin-top:0.5rem">No files uploaded yet.</p>
    </div>

    <div class="section">
        <h2>Registered Users</h2>
        <table id="usersTable">
            <thead><tr><th>Username</th><th>First Name</th><th>Last Name</th><th>Email</th><th>Birthday</th><th>Role</th><th>Joined</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="section">
        <h2> Danger Zone</h2>
        <button class="btn btn-danger" onclick="clearKB()">Clear Entire Knowledge Base</button>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
    <script>requireAuth();</script>
</body>
</html>
