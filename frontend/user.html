<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Math AI — Ask</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: #1e293b; }
        .header h1 { font-size: 1.2rem; }
        .btn { padding: 0.5rem 1rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
        .btn-danger { background: #ef4444; color: white; }
        .chat { flex: 1; overflow-y: auto; padding: 1.5rem 2rem; }
        .msg { max-width: 75%; padding: 0.8rem 1.1rem; border-radius: 10px; margin-bottom: 1rem; white-space: pre-wrap; line-height: 1.5; font-size: 0.95rem; }
        .msg.user { background: #3b82f6; margin-left: auto; border-bottom-right-radius: 2px; }
        .msg.bot { background: #1e293b; border: 1px solid #334155; border-bottom-left-radius: 2px; }
        .input-area { display: flex; padding: 1rem 2rem; background: #1e293b; gap: 0.75rem; }
        .input-area input { flex: 1; padding: 0.8rem 1rem; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #f8fafc; font-size: 1rem; }
        .input-area button { padding: 0.8rem 1.5rem; border: none; border-radius: 8px; background: #3b82f6; color: white; font-size: 1rem; cursor: pointer; }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Bouncing dots animation */
        .dots { display: inline-flex; gap: 5px; padding: 0.3rem 0; align-items: center; }
        .dot {
            width: 8px;
            height: 8px;
            background: #94a3b8;
            border-radius: 50%;
            animation: bounce 1.2s infinite ease-in-out;
        }
        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>  Math AI</h1>
        <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>

    <div class="chat" id="chat"></div>

    <div class="input-area">
        <input type="text" id="questionInput" placeholder="Ask a math question..." autocomplete="off">
        <button id="sendBtn" onclick="sendQuestion()">Ask</button>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/user.js"></script>
    <script>requireAuth();</script>
</body>
</html>
