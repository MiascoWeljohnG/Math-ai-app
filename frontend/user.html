<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Math AI — Ask</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/nav-drawer.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 260px; flex-shrink: 0; background: var(--bg-elevated-2); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 1rem; }
        .new-chat-btn { width: 100%; display: flex; align-items: center; gap: 0.5rem; padding: 0.65rem 0.9rem; background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text); border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
        .new-chat-btn:hover { border-color: var(--accent); }
        .convo-list { flex: 1; overflow-y: auto; padding: 0.25rem 0.5rem; }
        .convo-item { display: flex; align-items: center; justify-content: space-between; gap: 0.4rem; padding: 0.6rem 0.75rem; border-radius: 8px; cursor: pointer; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .convo-item:hover { background: var(--bg-elevated); }
        .convo-item.active { background: var(--bg-elevated); color: var(--text); }
        .convo-item .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
        .convo-item .del-btn { opacity: 0; background: none; border: none; color: var(--text-muted); font-size: 0.9rem; cursor: pointer; flex-shrink: 0; padding: 2px 4px; }
        .convo-item:hover .del-btn { opacity: 1; }
        .convo-item .del-btn:hover { color: var(--danger); }
        .sidebar-empty { color: var(--text-muted); font-size: 0.8rem; padding: 0.75rem; }

        /* Main panel */
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: var(--bg-elevated); }
        .header h1 { font-size: 1.2rem; }
        .btn { padding: 0.5rem 1rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
        .btn-danger { background: var(--danger); color: white; }
        .chat { flex: 1; overflow-y: auto; padding: 1.5rem 2rem; }
        .msg { max-width: 75%; padding: 0.8rem 1.1rem; border-radius: 10px; margin-bottom: 1rem; white-space: pre-wrap; line-height: 1.5; font-size: 0.95rem; }
        .msg.user { background: var(--bubble-user); color: white; margin-left: auto; border-bottom-right-radius: 2px; }
        .msg.bot { background: var(--bubble-bot); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
        .input-area { display: flex; padding: 1rem 2rem; background: var(--bg-elevated); gap: 0.75rem; }
        .input-area input { flex: 1; padding: 0.8rem 1rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-input); color: var(--text); font-size: 1rem; }
        .input-area button { padding: 0.8rem 1.5rem; border: none; border-radius: 8px; background: var(--accent); color: white; font-size: 1rem; cursor: pointer; }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Bouncing dots animation */
        .dots { display: inline-flex; gap: 5px; padding: 0.3rem 0; align-items: center; }
        .dot {
            width: 8px;
            height: 8px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.2s infinite ease-in-out;
        }
        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" id="newChatBtn">+ New chat</button>
        </div>
        <div class="convo-list" id="convoList">
            <div class="sidebar-empty">No conversations yet</div>
        </div>
    </div>

    <div class="main">
        <div class="header">
            <div style="display:flex; align-items:center; gap:0.5rem;">
                <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menu">
                    <span></span><span></span><span></span>
                </button>
                <h1>Math AI</h1>
            </div>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </div>

        <div class="chat" id="chat"></div>

        <div class="input-area">
            <input type="text" id="questionInput" placeholder="Ask a math question..." autocomplete="off">
            <button id="sendBtn" onclick="sendQuestion()">Ask</button>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/user.js"></script>
    <script>requireAuth(); initNavDrawer();</script>
</body>
</html>
