<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iSipnayan — Login</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="theme-toggle-wrap" id="themeToggleWrap"></div>

    <span class="blob b-green"></span>
    <span class="blob b-yellow"></span>
    <span class="blob b-red"></span>
    <span class="blob b-lime"></span>
    <span class="blob b-pink"></span>

    <main class="auth-card login-card">
        <img class="logo" src="img/logo.png" alt="iSipnayan">
        <p class="tagline">Where <span class="num">Numbers</span> meet the <span class="fut">Future</span></p>

        <form id="authForm">
            <input class="plain-field" type="text" id="username" placeholder="Username" required autocomplete="username">
            <input class="plain-field" type="password" id="password" placeholder="Password" required autocomplete="current-password">

            <p class="form-msg" id="error"></p>
            <button type="submit" class="btn-primary" id="submitBtn">LOGIN</button>
        </form>

        <p class="switch-line">Don't have an account? <a href="signup.html">Sign up</a></p>
    </main>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById("themeToggleWrap").innerHTML = themeSwitchHTML("indexThemeSwitch");
        wireThemeSwitch("indexThemeSwitch");
    </script>
</body>
</html>
