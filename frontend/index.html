<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iSipnayan — Login</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="theme-toggle-wrap" id="themeToggleWrap"></div>
  
    <span class="blob b-green"></span>
    <span class="blob b-yellow"></span>
    <span class="blob b-red"></span>
    <span class="blob b-lime"></span>
    <span class="blob b-pink"></span>
  
    <main class="auth-card login-card">
        <img class="logo" src="img/logo.png" alt="iSipnayan">
        <p class="tagline">Where <span class="num">Numbers</span> meet the <span class="fut">Future</span></p>
  
        <form id="authForm">
            <input class="plain-field" type="text" id="username" placeholder="Username" required autocomplete="username">
            
            <!-- FIXED: Added password eye icon toggle -->
            <div class="pwd-wrap" style="position: relative; margin-top: 0.8rem; margin-bottom: 0.8rem;">
                <input class="plain-field" type="password" id="password" placeholder="Password" required autocomplete="current-password" style="width: 100%; padding-right: 2.5rem; margin: 0;">
                <button type="button" class="eye" tabindex="-1" aria-label="Show password" onclick="const p = document.getElementById('password'); p.type = p.type === 'password' ? 'text' : 'password';" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted);">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
            </div>
  
            <p class="form-msg" id="error"></p>
            <button type="submit" class="btn-primary" id="submitBtn">LOGIN</button>
        </form>
  
        <p class="switch-line">Don't have an account? <a href="signup.html">Sign up</a></p>
    </main>
  
    <script src="js/auth.js"></script>
    <script>
        document.getElementById("themeToggleWrap").innerHTML = themeSwitchHTML("indexThemeSwitch");
        wireThemeSwitch("indexThemeSwitch");
    </script>
</body>
</html>
