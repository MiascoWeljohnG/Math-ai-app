<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#F2F5FA">
    <title>Games — IsipNayan</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/nav-drawer.css">
    <link rel="stylesheet" href="css/app-shell.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/pages.css?v=1">
    <link rel="stylesheet" href="css/games.css?v=1">
    <link rel="stylesheet" href="css/mobile.css?v=1">
</head>
<body class="home">
    <header class="app-header">
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
        <a class="brand-lockup" href="landing.html"><span class="brand-mark" aria-hidden="true"></span>IsipNayan</a>
    </header>

    <main class="content">
        <!-- Hub: progress, lesson picker and the game cards -->
        <div id="gmHub">
            <header class="home-head">
                <div>
                    <h1 class="page-title">Games</h1>
                    <p class="page-sub">Practice your lessons by playing. Games are for fun: they do not change your quiz scores or rankings.</p>
                </div>
            </header>

            <section class="gm-progress" aria-label="Your game progress">
                <div class="gm-level">
                    <strong id="gmLevel">Level 1</strong>
                    <div class="gm-xp" id="gmXpBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="XP toward the next level"><span id="gmXpFill"></span></div>
                    <small id="gmXpText">0 / 100 XP</small>
                </div>
                <div class="gm-stat"><strong id="gmStreak">0 days</strong><small>Play streak</small></div>
                <div class="gm-stat"><strong id="gmPlayed">0</strong><small>Rounds played</small></div>
            </section>

            <section class="panel gm-picker">
                <div class="gm-picker-row">
                    <label>Subject
                        <select id="gmSubject"><option value="">Loading…</option></select>
                    </label>
                    <label>Lesson
                        <select id="gmLesson"><option value="">General math words</option></select>
                    </label>
                </div>
                <p class="gm-note" id="gmPackStatus"></p>
                <p class="gm-note bad" id="gmPickerError" hidden></p>
            </section>

            <div class="gm-grid" id="gmGrid"></div>
        </div>

        <!-- Player: one game at a time -->
        <div id="gmPlayer" hidden>
            <div class="gm-player-bar">
                <button class="gm-btn" type="button" id="gmBack">All games</button>
                <div>
                    <h1 class="gm-player-title" id="gmPlayerTitle"></h1>
                    <p class="gm-note" id="gmPlayerLesson"></p>
                </div>
            </div>
            <section class="gm-board" id="gmStageHost"></section>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/games-core.js?v=2"></script>
    <script src="js/games-modes.js"></script>
    <script src="js/games.js?v=2"></script>
    <script>requireAuth(); initNavDrawer();</script>
    <footer class="bottom-footer">All Rights Reserved <span class="sep">|</span> @2026</footer>
</body>
</html>
