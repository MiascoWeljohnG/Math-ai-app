<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#F2F5FA">
    <link rel="icon" href="data:,">
    <title>Reminders · Teacher Dashboard</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/nav-drawer.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/overview.css">
    <link rel="stylesheet" href="css/pages.css?v=1">
    <link rel="stylesheet" href="css/mobile.css?v=1">
    <link rel="stylesheet" href="css/admin-profile.css?v=1">
</head>
<body>
<div class="page">
    <div class="header" id="staffHeader" data-title="Teacher Dashboard"></div>
    <script src="js/staff-header.js"></script>

    <div class="section">
        <div class="section-head">
            <h2>Reminders</h2>
            <p class="hint">Notes students see on their Roadmap page. Pick one student or everyone.</p>
        </div>
        <div class="stack">
            <label for="reminderTarget" class="label">Send to</label>
            <select id="reminderTarget" class="branch-select"></select>
            <label for="reminderMessage" class="label">Message</label>
            <textarea id="reminderMessage" rows="2" maxlength="300" placeholder="e.g. Finish the Algebra quiz before Friday"></textarea>
            <label for="reminderDue" class="label">Due date (optional)</label>
            <input id="reminderDue" type="date" class="branch-select">
            <button class="btn btn-primary" type="button" id="reminderSend">Send reminder</button>
            <div class="status" id="reminderStatus" role="status" aria-live="polite"></div>
        </div>
        <h3>Your reminders</h3>
        <div class="table-wrap">
            <table>
                <thead><tr><th>To</th><th>Message</th><th>Due</th><th></th></tr></thead>
                <tbody id="reminderRows"></tbody>
            </table>
        </div>
        <p class="empty" id="noReminders" style="display:none;">You haven't sent any reminders yet.</p>
    </div>
</div>

    <script src="js/modal.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/material-table.js"></script>
    <script src="js/teacher-common.js"></script>
    <script src="js/reminders.js"></script>
    <script src="js/teacher-bell.js"></script>
    <script>
        requireRole("teacher");
        initNavDrawer({ staff: true, pages: STAFF_PAGES.teacher });
    </script>
</body>
</html>
