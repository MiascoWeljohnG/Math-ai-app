<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#F2F5FA">
    <link rel="icon" href="data:,">
    <title>Upload Course Material · Teacher Dashboard</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/nav-drawer.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/overview.css">
    <link rel="stylesheet" href="css/pages.css?v=1">
    <link rel="stylesheet" href="css/mobile.css?v=1">
    <link rel="stylesheet" href="css/admin-profile.css?v=1">
</head>
<body>
<div class="page">
    <div class="header" id="staffHeader" data-title="Teacher Dashboard"></div>
    <script src="js/staff-header.js"></script>

    <div class="section">
        <h2>Upload Course Material</h2>
        <div class="drop-zone" id="dropZone">
            <p class="placeholder" id="dropPlaceholder">Drag & drop text, PDF, Word, PowerPoint files, or scans and photos (read with OCR) here, or click to browse</p>
        </div>
        <input type="file" id="fileInput" multiple accept=".txt,.pdf,.docx,.pptx,.png,.jpg,.jpeg,.webp,.bmp,.tif,.tiff" style="display:none">
        <div class="field-row" style="margin-top:1rem;">
            <label for="branchSelect" class="label">Math branch</label>
            <select id="branchSelect" class="branch-select">
                <option value="Auto" selected>Auto-detect (AI)</option>
            </select>
        </div>
        <button class="btn btn-primary" id="uploadBtn" onclick="uploadFiles()" disabled>Upload & Ingest</button>
        <div class="status" id="uploadStatus"></div>
        <p class="hint" style="margin-top:0.75rem;">Once a file is uploaded, you can follow it as it is read by the AI in <a href="teacher-files.html">Your Uploaded Files</a>.</p>
    </div>
</div>

    <script src="js/modal.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/material-table.js"></script>
    <script src="js/teacher-common.js"></script>
    <script src="js/topic-picker.js"></script>
    <script src="js/teacher-upload.js"></script>
    <script src="js/teacher-bell.js"></script>
    <script>
        requireRole("teacher");
        initNavDrawer({ staff: true, pages: STAFF_PAGES.teacher });
    </script>
</body>
</html>
